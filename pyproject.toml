[tool.poetry]
name = "lineageos_updates_bot"
version = "1.0.0"
description = "LineageOS updates Telegram bot"
authors = ["Sebastiano Barezzi <seba@sebaubuntu.dev>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sebaubuntu-python/lineageos_updates_bot"

[tool.poetry.dependencies]
python = "^3.9"
humanize = "^4.10.0"
liblineage = "^1.8.1"
python-telegram-bot = "^22.5"
sebaubuntu-libs = "^2.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true
